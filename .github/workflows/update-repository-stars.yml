name: Update repository stars

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository-stars
  cancel-in-progress: false

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Update GitHub star counts
        run: npm run update:stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated data
        run: npm run lint && npm run build

      - name: Commit updated counts
        run: |
          if git diff --quiet -- src/repositories/repository-stars.js; then
            echo "Repository star counts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/repositories/repository-stars.js
          git commit -m "chore: refresh repository stars"
          git push
